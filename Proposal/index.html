<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="heart-rain" aria-hidden="true">
        <span>♥</span><span>♥</span><span>♥</span><span>♥</span><span>♥</span>
        <span>♥</span><span>♥</span><span>♥</span><span>♥</span><span>♥</span>
        <span>♥</span><span>♥</span><span>♥</span><span>♥</span><span>♥</span>
        <span>♥</span><span>♥</span><span>♥</span><span>♥</span><span>♥</span>
        <span>♥</span><span>♥</span><span>♥</span><span>♥</span><span>♥</span>
        <span>♥</span><span>♥</span><span>♥</span><span>♥</span><span>♥</span>
        <span>♥</span><span>♥</span><span>♥</span><span>♥</span><span>♥</span>
        <span>♥</span><span>♥</span><span>♥</span><span>♥</span><span>♥</span>
        <span>♥</span><span>♥</span><span>♥</span><span>♥</span><span>♥</span>
    </div>
    <main class="scene">
        <audio class="background-music" src="can_you_hold_me_down.mp3" autoplay loop preload="auto"></audio>
        <button class="envelope" type="button" aria-expanded="false" aria-label="Open the letter">
            <span class="letter">
                <span class="letter-title">Love Confenssion</span>
                <span class="dear">Dear Crush</span>
                <span class="letter-message">My heart is too weak to cage this love of mine;<br>
                    if these pages can keep it confined,<br>
                    a thousand I will write,<br>
                    a hundred I will fold,<br>
                    tens I will send like paper planes,<br>
                    with the hope of landing one in your hands.</span>
                <span class="letter-question">Adrianah, will you be my girlfriend?</span>
                <span class="letter-signoff">♥</span>
            </span>
            <span class="rose-bear" aria-hidden="true">
                <svg viewBox="0 0 150 150" role="presentation">
                    <ellipse cx="76" cy="136" rx="44" ry="7" fill="#8d4960" opacity=".16"/>
                    <circle cx="45" cy="39" r="19" fill="#c8875b"/>
                    <circle cx="105" cy="39" r="19" fill="#c8875b"/>
                    <circle cx="45" cy="39" r="10" fill="#f2c4a2"/>
                    <circle cx="105" cy="39" r="10" fill="#f2c4a2"/>
                    <ellipse cx="75" cy="101" rx="39" ry="37" fill="#c8875b"/>
                    <ellipse cx="75" cy="61" rx="39" ry="34" fill="#d99a6d"/>
                    <ellipse cx="75" cy="72" rx="21" ry="16" fill="#f6d7bd"/>
                    <circle cx="62" cy="58" r="3.5" fill="#492e35"/>
                    <circle cx="88" cy="58" r="3.5" fill="#492e35"/>
                    <ellipse cx="75" cy="68" rx="4" ry="3" fill="#78454b"/>
                    <path d="M72 73q3 4 6 0" fill="none" stroke="#78454b" stroke-width="2" stroke-linecap="round"/>
                    <ellipse cx="57" cy="69" rx="6" ry="3" fill="#e9a3a0" opacity=".75"/>
                    <ellipse cx="93" cy="69" rx="6" ry="3" fill="#e9a3a0" opacity=".75"/>
                    <ellipse cx="50" cy="101" rx="13" ry="18" fill="#d99a6d" transform="rotate(28 50 101)"/>
                    <ellipse cx="101" cy="99" rx="13" ry="18" fill="#d99a6d" transform="rotate(-35 101 99)"/>
                    <path d="M91 91l11-22" stroke="#56835c" stroke-width="3" stroke-linecap="round"/>
                    <path d="M97 81q-12-5-10-12 9 0 10 12m-2 5q11-9 16-4-3 9-16 4" fill="#7eaa76"/>
                    <path d="M96 71c-8-1-8-12 0-13 4-7 14-3 13 3 7 4 3 12-3 12-3 6-11 4-10-2z" fill="#d84d70"/>
                    <path d="M96 67q4-7 10-5m-9 9q6-3 10 1" fill="none" stroke="#f58ba3" stroke-width="2" stroke-linecap="round"/>
                    <circle cx="111" cy="54" r="2" fill="#eab2c5"/>
                    <path d="M37 80q-8-6-11 0m91 0q8-6 11 0" fill="none" stroke="#fff4ed" stroke-width="3" stroke-linecap="round"/>
                </svg>
            </span>
            <span class="envelope-back"></span>
            <span class="envelope-flap"></span>
            <span class="envelope-pocket"></span>
            <span class="envelope-seal">♥</span>
            <span class="tap-hint">Open me</span>
        </button>
        <div class="answer-buttons" hidden>
            <button class="answer-button yes-button" type="button">Yes</button>
            <button class="answer-button no-button" type="button">No</button>
        </div>
        <div class="gif-response" hidden>
            <img src="https://media.giphy.com/media/v1.Y2lkPWVjZjA1ZTQ3NjdxcTBqbnRkeXRwdzc1MXV1Mjd4aXZycnUyMjU0aGkxb3dhd2N5YiZlcD12MV9naWZzX3NlYXJjaCZjdD1n/ahNiyUhWB1hPq/giphy.gif" alt="A celebratory animated reaction" />
        </div>
    </main>
    <script>
        const music = document.querySelector('.background-music');
        music.volume = 0.5;
        const startMusic = () => {
            music.play().catch(() => {
                const startOnInteraction = () => {
                    music.play().catch(() => {});
                    document.removeEventListener('pointerdown', startOnInteraction);
                    document.removeEventListener('keydown', startOnInteraction);
                };
                document.addEventListener('pointerdown', startOnInteraction, { once: true });
                document.addEventListener('keydown', startOnInteraction, { once: true });
            });
        };
        music.addEventListener('canplay', startMusic, { once: true });
        startMusic();

        const envelope = document.querySelector('.envelope');
        const answerButtons = document.querySelector('.answer-buttons');
        const gifResponse = document.querySelector('.gif-response');
        const responseGif = gifResponse.querySelector('img');
        const rejectionGif = responseGif.src;
        const acceptanceGif = 'https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExa29qdmhpbjUyeGVtZDlsYzhkbmc1ZTIzbzc2NzRkc29iMHk1dDdqaCZlcD12MV9naWZzX3NlYXJjaCZjdD1n/rezFjKsekHKhDqQ3yB/giphy.gif';
        const tapHint = envelope.querySelector('.tap-hint');
        let noConfirmationStep = 0;
        const playAcceptedResponse = () => {
            noConfirmationStep = 4;
            document.body.classList.add('is-agreed');
            responseGif.src = acceptanceGif;
            responseGif.alt = 'A happy celebration';
            gifResponse.hidden = false;
            music.pause();
            music.src = 'accepted.mp3';
            music.load();
            music.volume = 0.5;
            music.play().catch(() => {});
        };
        envelope.addEventListener('click', () => {
            const isOpen = envelope.classList.toggle('is-open');
            if (isOpen) {
                music.play().catch(() => {});
            } else {
                music.pause();
            }
            envelope.setAttribute('aria-expanded', isOpen);
            envelope.setAttribute('aria-label', isOpen ? 'Close the letter' : 'Open the letter');
            tapHint.textContent = isOpen ? 'Tap to close' : 'Open me';
            noConfirmationStep = 0;
            answerButtons.hidden = !isOpen;
            gifResponse.hidden = true;
        });

        document.querySelector('.no-button').addEventListener('click', () => {
            if (envelope.classList.contains('is-open')) {
                gifResponse.hidden = true;
                if (noConfirmationStep === 1 || noConfirmationStep === 2) {
                    noConfirmationStep = 3;
                    tapHint.textContent = 'Will you be my girlfriend?';
                } else if (noConfirmationStep === 0) {
                    noConfirmationStep = 1;
                    tapHint.textContent = 'Are you sure?';
                }
            }
        });

        document.querySelector('.yes-button').addEventListener('click', () => {
            if (noConfirmationStep === 1) {
                noConfirmationStep = 2;
                tapHint.textContent = 'Are you really, really sure?';
            } else if (noConfirmationStep === 2) {
                noConfirmationStep = 3;
                responseGif.src = rejectionGif;
                responseGif.alt = 'A playful rejection reaction';
                gifResponse.hidden = false;
                music.pause();
                music.src = 'rejected.mp3';
                music.load();
                music.volume = 0.5;
                music.play().catch(() => {});
            } else if (noConfirmationStep === 3 && tapHint.textContent === 'Will you be my girlfriend?') {
                playAcceptedResponse();
            } else if (noConfirmationStep === 0 && envelope.classList.contains('is-open')) {
                playAcceptedResponse();
            }
        });
    </script>
</body>
</html>
